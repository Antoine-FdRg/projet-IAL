version: '3.8'

services:
  save-service:
    build: .
    container_name: ial-save-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - ial-network
    depends_on:
      measurement-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ial-network:
    name: ial-pipeline_default
    external: true
