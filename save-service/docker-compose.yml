services:
  save-service:
    container_name: save-service
    image: ial/save-service:latest
    restart: unless-stopped
    environment:
      - PORT=${SAVE_SERVICE_PORT:-3000}
      - NODE_ENV=${SAVE_SERVICE_NODE_ENV:-development}
      - DB_HOST=${MEASUREMENT_DB_HOST_NAME:-measurement-db}
      - DB_PORT=${MEASUREMENT_DB_POSTGRES_PORT:-5432}
      - DB_NAME=${MEASUREMENT_DB_POSTGRES_DB_NAME:-measurement_db}
      - DB_USER=${MEASUREMENT_DB_POSTGRES_USER:-ial_user}
      - DB_PASSWORD=${MEASUREMENT_DB_POSTGRES_PASSWORD:-ial_password}
      - DB_POOL_MIN=${SAVE_SERVICE_DB_POOL_MIN:-2}
      - DB_POOL_MAX=${SAVE_SERVICE_DB_POOL_MAX:-10}

    ports:
      - "${PORT:-3000}:3000"
    networks:
      - cloud-network
      - internet-network
    depends_on:
      measurement-db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  cloud-network:
    driver: bridge
  internet-network:
    driver: bridge
