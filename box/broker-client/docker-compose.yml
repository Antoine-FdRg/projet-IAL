services:
  box-broker-client:
    image: ial/box-broker-client
    container_name: box-broker-client
    depends_on:
      - setup-broker
    environment:
      - NATS_SERVER=${NATS_SERVER}
      - PUSH_SCHEDULE_INTERVAL=10
      - NATS_PUBLISH_QUEUE=MEASUREMENT.to_clean
    networks:
      - nats-network
networks:
  nats-network:
    driver: bridge
