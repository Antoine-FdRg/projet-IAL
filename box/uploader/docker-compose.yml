services:
  uploader:
    image: ial/uploader
    container_name: uploader
    depends_on:
      - setup-broker
    environment:
      - NATS_SERVER=${NATS_SERVER}
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_USERNAME=app
      - MONGO_PASSWORD=root
      - MONGO_DATABASE=messagesdb
      - SAVE_SERVICE_URL=${SAVE_SERVICE_URL}
      - BOX_1_UUID=${BOX_1_UUID}
      - BOX_2_UUID=${BOX_2_UUID}
      - UPLOADER_SCHEDULE_INTERVAL=${UPLOADER_SCHEDULE_INTERVAL}
    networks:
      - station-network
      - cloud-network

networks:
  station-network:
    driver: bridge
  cloud-network:
    external: true
    name: ial-cloud_cloud-network
