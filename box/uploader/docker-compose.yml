services:
  uploader:
    image: ial/uploader
    container_name: uploader
    command: ["node", "dist/main.js"]
    depends_on:
      - setup-broker
      - mongo
    environment:
      - NATS_SERVER=${NATS_SERVER}
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_USERNAME=app
      - MONGO_PASSWORD=root
      - MONGO_DATABASE=messagesdb
      - SAVE_SERVICE_URL=${SAVE_SERVICE_URL}
      - BOX_1_UUID=${BOX_1_UUID}
      - BOX_2_UUID=${BOX_2_UUID}
    networks:
      - nats-network
      - mongo_mongo-network

networks:
  nats-network:
    driver: bridge
  mongo_mongo-network:
    external: true
