name: CI - Build Docker images

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: docker-build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make scripts executable + normalize line endings
        run: |
          chmod +x build-all.sh || true
          find . -maxdepth 4 -name build.sh -exec chmod +x {} \; || true
          sed -i 's/\r$//' build-all.sh || true
          find . -maxdepth 4 -name build.sh -exec sed -i 's/\r$//' {} \; || true

      - name: Build all images
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain
        run: |
          set -euo pipefail
          ./build-all.sh

      - name: List built images (debug)
        run: docker images
