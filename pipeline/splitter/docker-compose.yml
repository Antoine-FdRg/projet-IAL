services:
  splitter:
    image: ial/splitter
    container_name: splitter
    command: ["node", "dist/main.js"]
    depends_on:
      - setup-broker
    environment:
      - NATS_SERVER=${NATS_SERVER}
      - SPLITTER_CONSUME_QUEUE=MEASUREMENT.to_split
      - SPLITTER_PRODUCER_QUEUE=${SPLITTER_PRODUCER_QUEUE}
    networks:
      - nats-network
networks:
  nats-network:
    driver: bridge
