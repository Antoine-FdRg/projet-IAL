services:
  normalizer:
    image: ial/normalizer
    container_name: normalizer
    command: ["node", "dist/main.js"]
    depends_on:
      - setup-broker
    environment:
      - NATS_SERVER=${NATS_SERVER}
      - NATS_CONSUME_QUEUE=MEASUREMENT.to_normalize
      - CLEANER_PRODUCER_QUEUE=${CLEANER_PRODUCER_QUEUE}
    networks:
      - nats-network
networks:
  nats-network:
    driver: bridge
