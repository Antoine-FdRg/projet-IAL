version: '3.8'

services:
  family-notification-service:
    container_name: family-notification-service
    image: ial/family-notification-service:latest
    environment:
      # Cron Configuration
      - CRON_SCHEDULE=${CRON_SCHEDULE}
      - RUN_ON_STARTUP=${RUN_ON_STARTUP}

      # Discord Configuration
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}

      # Analyze Service Configuration
      - ANALYZE_SERVICE_URL=http://analyze-service:3001
      - ANALYZE_SERVICE_TIMEOUT=10000

      # User Database Configuration
      - USER_DB_HOST=${USER_DB_HOST_NAME}
      - USER_DB_PORT=${USER_DB_POSTGRES_PORT:-5432}
      - USER_DB_NAME=${USER_DB_POSTGRES_DB_NAME}
      - USER_DB_USER=${USER_DB_POSTGRES_USER}
      - USER_DB_PASSWORD=${USER_DB_POSTGRES_PASSWORD}

      # Measurement Database Configuration
      - MEASUREMENT_DB_HOST=${MEASUREMENT_DB_HOST_NAME}
      - MEASUREMENT_DB_PORT=${MEASUREMENT_DB_POSTGRES_PORT:-5432}
      - MEASUREMENT_DB_NAME=${MEASUREMENT_DB_POSTGRES_DB_NAME}
      - MEASUREMENT_DB_USER=${MEASUREMENT_DB_POSTGRES_USER}
      - MEASUREMENT_DB_PASSWORD=${MEASUREMENT_DB_POSTGRES_PASSWORD}
    # Dependencies managed externally - services already running
    # depends_on is commented out since services are in other docker-compose files
    networks:
      - cloud-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "node"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  cloud-network:
    external: true
    name: ial-cloud_cloud-network
